[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-port-sim"
version = "0.1.0"
description = "Discrete-event simulation layer for the Terminal Operations Core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1,<5",
    "terminal-core==0.1.0",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.8,<4",
]

[project.scripts]
mini-port-sim = "mini_port_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
