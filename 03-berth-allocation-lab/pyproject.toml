[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "berth-allocation-lab"
version = "0.1.0"
description = "Berth allocation optimization and experimentation layer for Port Operations Lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0,<2",
    "numpy>=1.24",
    "PyYAML>=6.0,<7",
    "mini-port-sim==0.1.0",
    "terminal-core==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
# Step 9 reinforcement learning. Bounds follow the installed, tested metadata:
# stable-baselines3 2.8.0 requires gymnasium>=0.29.1,<1.3.0 and torch>=2.3,<3.0;
# sb3-contrib 2.8.0 requires stable_baselines3>=2.8.0,<3.0. SB3 2.9 (torch>=2.8)
# is untested here, so both SB3 packages stay on the 2.8 series.
rl = [
    "gymnasium>=1.0,<1.3",
    "matplotlib>=3.5",
    "sb3-contrib>=2.8,<2.9",
    "stable-baselines3>=2.8,<2.9",
    "torch>=2.3,<3",
    "tqdm>=4.67.1,<5",  # installed/tested: 4.67.1; plain stderr progress, no rich dependency
]

[project.scripts]
berth-allocation-lab = "berth_allocation_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: multi-seed invariant checks and multi-run RL training workflows"]
