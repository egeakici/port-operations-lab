# Step 9 Regime B: Static Maskable PPO on static twins of MEDIUM and HEAVY.
# The 50/50 mixture is an explicit starting choice, not a tuned optimum.
schema_version: 1
experiment_id: static_ppo_medium_heavy_v1
experiment_version: 1
description: Static twins of MEDIUM (16 vessels) and HEAVY (24 vessels), equal weights.
max_vessels: 24
time_scale_min: 1440.0
length_scale_m: 1000.0
reward_scale: 0.0006944444444444445  # 1/1440, training signal only
exact_max_vessels: 8
output_dir: experiments/rl/static_ppo
components:
  - name: medium
    source_config: configs/scenarios/synthetic_medium.yaml
    base_scenario_id: bap_medium
    static_twin: true
    weight: 0.5
  - name: heavy
    source_config: configs/scenarios/synthetic_heavy.yaml
    base_scenario_id: bap_heavy
    static_twin: true
    weight: 0.5
training:
  training_seeds: [11, 23, 37]
  total_timesteps: 100000  # extended budget; pilots pass --total-timesteps
  eval_freq: 5000
ppo:
  policy: MultiInputPolicy
  gamma: 1.0
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 128
  n_epochs: 5
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: {pi: [128, 128], vf: [128, 128]}
  n_envs: 1
  device: cpu
validation:
  seeds_per_component: 6
test:
  seeds_per_component: 10
diagnostics:
  - name: low_traffic
    seeds_per_component: 10
    components:
      - name: low
        source_config: configs/scenarios/synthetic_low.yaml
        base_scenario_id: bap_low
  # Distribution shift: same physics, smaller quay; exact applies (<= 8 vessels).
  - name: cross_family_tiny
    seeds_per_component: 4
    components:
      - name: tiny_n6
        source_config: configs/scenarios/synthetic_tiny_congested.yaml
        base_scenario_id: bap_tiny_n6
        vessel_count: 6
        excluded_seeds: [0, 1, 42]
      - name: tiny_n7
        source_config: configs/scenarios/synthetic_tiny_congested.yaml
        base_scenario_id: bap_tiny_n7
        vessel_count: 7
        excluded_seeds: [0, 1, 42]
      - name: tiny_n8
        source_config: configs/scenarios/synthetic_tiny_congested.yaml
        base_scenario_id: bap_tiny_n8
        vessel_count: 8
        excluded_seeds: [0, 1, 42]
