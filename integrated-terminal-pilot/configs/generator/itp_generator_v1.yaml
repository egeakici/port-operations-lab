      speed_m_per_min: 250.0
      handover_min: 2.0
      units_per_crane: 4
    yard:
      constraints_enabled: true
      congestion_rho0: 0.7
      congestion_g_min: 0.5
      landside_reserved_fraction: 0.2
      gate_flow_demand: block_handling_capacity
    work:
      batch_size_containers: 10
      max_load_wait_min: 240.0
    visibility:
      future_horizon_min: 240.0
    episode:
      max_drain_extension_min: 10080.0
    kernel:
      same_timestamp_cycle_limit: 10000
    landside:
      export_cutoff_min: 360.0
