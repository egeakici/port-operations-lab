# Project I Step 2 generator configuration (itp_generator_v1).
# SYNTHETIC - NOT CALIBRATED TO A REAL TERMINAL.
# Every parameter below is covered by exactly one record in
# itp_generator_v1_decisions.yaml; the loader rejects uncovered or mismatched values.
config_schema_version: 2
generator_version: itp_generator_v1
scenario_schema_version: itp_scenario_v1
stream_namespace: itp_v1

seed_bands:
  development: {first: 10000000, last: 10999999}
  validation: {first: 11000000, last: 11999999}
  test: {first: 12000000, last: 12999999}
  diagnostic: {first: 13000000, last: 13999999}

generation_policy:
  allowed_splits: [development]

development_batch:
