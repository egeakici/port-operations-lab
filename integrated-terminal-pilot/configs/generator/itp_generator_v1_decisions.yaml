    allowed_range: "disjoint 1,000,000-wide bands"
    source_kind: STEP1_FROZEN
    source_document: docs/scientific_experiment_protocol.md
    source_section: "6.1 Seed bands (FROZEN after collision audit); 6.2 collision audit"
    rationale: Collision audit passed in Step 1; bands fixed.
    status: FROZEN
    linked_step1_decision: D23
