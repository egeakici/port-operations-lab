# Step 2 parameter decision register for itp_generator_v1.
# status: FROZEN | PROPOSED_PENDING_REVIEW | BLOCKED | DEFERRED
#   FROZEN                  - fixed by a FROZEN Step 1 decision (or the Step 2 brief for process rules)
#   PROPOSED_PENDING_REVIEW - Step 1 PROPOSED value, repository-derived value, or Step 2 provisional value;
#                             usable for DEVELOPMENT scenarios only; must be approved before validation.
# source_kind: STEP1_FROZEN | STEP1_PROPOSED | STEP1_INFERRED | REPOSITORY_DERIVED | STEP2_PROVISIONAL | STEP2_BRIEF
# Every leaf of itp_generator_v1.yaml (except config_schema_version) must be covered exactly once,
# and selected_value must equal the configured value at every listed path.
register_version: 1
records:
  - decision_id: S2-001
    parameter_name: generator_version
    parameter_paths: [generator_version]
    selected_value: itp_generator_v1
    unit: none
    allowed_range: "itp_generator_v1"
    source_kind: STEP1_FROZEN
    source_document: docs/unified_data_contract.md
    source_section: "2.1 Identity block; implementation_roadmap.md Step 2 scope"
    rationale: Generator identity named by Step 1.
    status: FROZEN
    linked_step1_decision: D01
    impact_on_generator: Recorded in every scenario identity block and manifest.
    impact_on_future_simulator: None (provenance only).
  - decision_id: S2-002
    parameter_name: scenario_schema_version
    parameter_paths: [scenario_schema_version]
    selected_value: itp_scenario_v1
    unit: none
    allowed_range: "itp_scenario_v1"
    source_kind: STEP1_FROZEN
    source_document: docs/unified_data_contract.md
    source_section: "2 Scenario document"
    rationale: Scenario schema family frozen in Step 1.
    status: FROZEN
    linked_step1_decision: D13
    impact_on_generator: Written as schema_version; loader rejects mismatches.
    impact_on_future_simulator: Kernel loads only this schema.
