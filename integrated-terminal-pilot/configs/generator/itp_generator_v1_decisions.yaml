    allowed_range: "itp_v1"
    source_kind: STEP1_FROZEN
    source_document: docs/scientific_experiment_protocol.md
    source_section: "6.3 Namespaced, entity-keyed exogenous streams (FROZEN)"
    rationale: Key prefix of the frozen stream formula; keeps Project I disjoint from Project 03 generation.
    status: FROZEN
    linked_step1_decision: D23
    impact_on_generator: Prefix of every stream key.
    impact_on_future_simulator: None (no runtime randomness in v1, D19).
