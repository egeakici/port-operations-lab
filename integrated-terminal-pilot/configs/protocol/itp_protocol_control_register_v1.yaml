# Project I protocol control register (itp_protocol_control_register_v1).
#
# Machine-readable, append-only companion of docs/protocol_amendments.md for approvals that are NOT
# generator parameter values (those live in configs/generator/itp_generator_v1_decisions.yaml).
# Loaded and validated by integrated_terminal_pilot.benchmark.protocol_records; unknown fields or
# statuses are rejected. Records are never deleted or rewritten: a later record supersedes an earlier
# one through `supersedes`.
#
# status vocabulary (closed):
#   APPROVED_IN_EFFECT                      - approved design/configuration, in effect for development
#                                             and for the future pre-validation setup
#   APPROVED_FOR_STEP6_DESIGN_NOT_VALIDATION_LOCKED
#                                           - approved pre-registration for Step 6/7 design; binding,
#                                             but not part of any validation lock until Step 7 writes it
#   SUPERSEDED                              - kept for history; replaced by `superseded_by`
#
# None of these statuses is a scientific lock. protocol_lock_v1.json is written only at Step 7.
